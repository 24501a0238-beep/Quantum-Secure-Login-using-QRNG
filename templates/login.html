<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Quantum Secure Login</h1>
        <p>Enter your mobile number and the CAPTCHA code below</p>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="mobile">Mobile Number:</label>
                <input type="text" id="mobile" name="mobile" required>
            </div>
            
            <div class="form-group">
                <label for="captcha">CAPTCHA Code:</label>
                <div class="captcha-container">
                    <div class="captcha-code">{{ captcha }}</div>
                    <button type="button" onclick="window.location.reload()">Refresh</button>
                </div>
                <input type="text" id="captcha" name="captcha" required>
            </div>
            
            <button type="submit">Send OTP</button>
        </form>
        
        <p class="note">Note: CAPTCHA and OTP are generated using quantum randomness</p>
    </div>
</body>
</html>
